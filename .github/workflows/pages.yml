# Publica la app en GitHub Pages cada vez que se sube un cambio a la rama main.
# Requisitos (una sola vez, ver README):
#   1) Settings → Pages → Source: "GitHub Actions"
#   2) Settings → Secrets and variables → Actions → crear los secretos
#      VITE_SUPABASE_URL y VITE_SUPABASE_ANON_KEY (solo la clave pública anon/publishable)
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Revisar que estén configuradas las claves públicas de Supabase
        env:
          URL: ${{ secrets.VITE_SUPABASE_URL }}
          KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "::error::Faltan los secretos VITE_SUPABASE_URL y/o VITE_SUPABASE_ANON_KEY (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          case "$KEY" in
            sb_secret_*|*service_role*) echo "::error::VITE_SUPABASE_ANON_KEY parece una clave SECRETA. Usa solo la clave pública (anon / publishable)."; exit 1;;
          esac

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Instalar dependencias
        working-directory: client
        run: npm ci

      - name: Compilar
        working-directory: client
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_USAR_DRIVE: ${{ vars.VITE_USAR_DRIVE }}
          VITE_LOGIN_GOOGLE: ${{ vars.VITE_LOGIN_GOOGLE }}
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
